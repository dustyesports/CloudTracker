name: Hourly Package Tracker

on:
  schedule:
    # Runs at minute 0 of every hour (UTC)
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Restore tracker state
        uses: actions/cache/restore@v4
        with:
          path: .tracker-state.json
          key: tracker-state-${{ github.repository_id }}-v1

      - name: Run tracking check
        env:
          TRACKING_NUMBER: ${{ secrets.TRACKING_NUMBER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TRACKING_URL: ${{ secrets.TRACKING_URL }}
          KEYWORD: ${{ vars.KEYWORD || 'Vore' }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
          STATE_FILE: .tracker-state.json
        run: python -m tracker.check

      - name: Save tracker state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .tracker-state.json
          key: tracker-state-${{ github.repository_id }}-v1
